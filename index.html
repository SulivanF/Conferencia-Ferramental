<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Conferência de Ferramental</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --primary: #f85149;
            --primary-hover: #da3633;
            --input-bg: #0d1117;
            --accent-glow: rgba(248, 81, 73, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1050px;
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .header-title-container {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        h1 {
            color: var(--text-main);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .header-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 35px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="date"], select, textarea {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus, input[type="date"]:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .section-title {
            display: flex;
            align-items: center;
            background: linear-gradient(90deg, rgba(248, 81, 73, 0.15) 0%, transparent 100%);
            border-left: 4px solid var(--primary);
            color: var(--text-main);
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 35px 0 20px 0;
            border-radius: 0 8px 8px 0;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        th {
            background-color: rgba(22, 27, 34, 0.95);
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        tbody tr {
            transition: background-color 0.15s ease;
        }

        tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .periodicity-group {
            display: flex;
            gap: 10px;
            align-items: center;
            background-color: var(--input-bg);
            padding: 6px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            height: 45px;
        }

        .periodicity-group label {
            flex: 1;
            margin-bottom: 0;
            cursor: pointer;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            padding: 6px;
            border-radius: 6px;
            transition: all 0.2s;
            text-transform: none;
        }

        .periodicity-group input[type="radio"] {
            accent-color: var(--primary);
        }

        .opinion-group {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            background-color: var(--input-bg);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
        }

        .opinion-group label {
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 0;
            text-transform: none;
            font-size: 13px;
            font-weight: 500;
            padding: 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .opinion-group label:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }

        .opinion-group input[type="radio"] {
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
        }

        .signatures {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .signature-line {
            border-top: 1px solid var(--border-color);
            text-align: center;
            padding-top: 10px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .btn-container {
            text-align: center;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(248, 81, 73, 0.3);
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(248, 81, 73, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }
        
        /* Estilos de Impressão e PDF preservando o visual moderno */
        @media print {
            body {
                background-color: #0d1117 !important;
                color: #f0f6fc !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                padding: 0;
            }
            .container {
                background-color: #161b22 !important;
                border: 1px solid #30363d !important;
                box-shadow: none !important;
                padding: 30px;
                max-width: 100%;
                border-radius: 0;
            }
            input[type="text"], input[type="date"], select, textarea {
                background-color: #0d1117 !important;
                border: 1px solid #30363d !important;
                color: #f0f6fc !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .section-title {
                background: linear-gradient(90deg, rgba(248, 81, 73, 0.15) 0%, transparent 100%) !important;
                border-left: 4px solid #f85149 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            th {
                background-color: #161b22 !important;
                color: #8b949e !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            td {
                border-bottom: 1px solid #30363d !important;
                color: #f0f6fc !important;
            }
            .periodicity-group, .opinion-group {
                background-color: #0d1117 !important;
                border: 1px solid #30363d !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .signature-line {
                border-top: 1px solid #30363d !important;
                color: #8b949e !important;
            }
            .btn-container {
                display: none;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title-container">
        <h1>Relatório de Conferência de Ferramental</h1>
        <div class="subtitle">Equipe Técnica Regional Ampére</div>
    </div>

    <form id="ferramentalForm">
        <div class="header-grid">
            <div class="form-group">
                <label for="colaborador">Colaborador / Técnico</label>
                <input type="text" id="colaborador" placeholder="Nome do colaborador...">
            </div>
            <div class="form-group">
                <label for="dataConferencia">Data da Conferência</label>
                <input type="date" id="dataConferencia">
            </div>
            <div class="form-group">
                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" placeholder="Cidade...">
            </div>
            <div class="form-group">
                <label for="veiculo">Veículo</label>
                <input type="text" id="veiculo" placeholder="Modelo / Placa...">
            </div>
            <div class="form-group">
                <label for="responsavel">Responsável pela Conferência</label>
                <input type="text" id="responsavel" placeholder="Nome do responsável...">
            </div>
            <div class="form-group">
                <label>Periodicidade</label>
                <div class="periodicity-group">
                    <label><input type="radio" name="periodicidade" value="Inicial"> Inicial</label>
                    <label><input type="radio" name="periodicidade" value="Periódica"> Periódica</label>
                    <label><input type="radio" name="periodicidade" value="Final"> Final</label>
                </div>
            </div>
        </div>

        <div class="section-title">Relação de Ferramentas e Equipamentos</div>
        
        <table>
            <thead>
                <tr>
                    <th style="width: 6%;">Nº</th>
                    <th style="width: 36%;">Ferramenta / Equipamento</th>
                    <th style="width: 9%;">Qtd.</th>
                    <th style="width: 20%;">Situação</th>
                    <th style="width: 10%;">Conferido</th>
                    <th style="width: 19%;">Observações</th>
                </tr>
            </thead>
            <tbody id="tabelaFerramentas">
                <!-- Preenchido via JavaScript -->
            </tbody>
        </table>

        <div class="section-title">Parecer da Conferência</div>
        <div class="opinion-group">
            <label><input type="radio" name="parecer" value="Tudo conferido e disponível"> Todo o ferramental conferido e disponível para utilização.</label>
            <label><input type="radio" name="parecer" value="Itens danificados ou manutenção"> Existem itens danificados ou que necessitam manutenção.</label>
            <label><input type="radio" name="parecer" value="Itens faltantes"> Existem itens faltantes, devendo ser providenciada reposição.</label>
        </div>

        <div class="section-title">Descrição das Pendências / Observações Gerais</div>
        <div class="form-group" style="margin-bottom: 25px;">
            <textarea id="observacoesGerais" rows="4" placeholder="Descreva eventuais pendências encontradas..."></textarea>
        </div>

        <div class="signatures">
            <div class="signature-line">Técnico 1</div>
            <div class="signature-line">Técnico 2</div>
            <div class="signature-line">Responsável</div>
        </div>

        <div class="btn-container">
            <button type="button" class="btn" onclick="imprimirRelatorio()">Salvar / Imprimir Relatório</button>
        </div>
    </form>
</div>

<script>
    const itens = [
        "Alicate de crimpar", "Alicate de corte", "Alicate universal", "Bits para parafusadeira", 
        "Broca para concreto", "Broca para madeira", "Caneta teste de indução", "Carrinho de Fibra", 
        "Chave cachimbo", "Chave de boca", "Chave de fenda", "Chave Phillips", "Clivador", 
        "Cone de sinalização", "Estilete", "Facão", "Furadeira", "Guia (Passa Fio)", 
        "Kit conector de fibra", "Laser", "Limpador de ONU", "Martelo", "Modelo do celular", 
        "Modelo do notebook", "Nivelador de escada", "Parafusadeira", "Power Meter", 
        "Testador de cabo", "Vara de Manobra", "Vara de pescar Fio", "Estado do Veículo"
    ];

    const tbody = document.getElementById('tabelaFerramentas');

    itens.forEach((item, index) => {
        const num = index + 1;
        const isVeiculo = item === "Estado do Veículo";
        const situacaoOpcoes = isVeiculo 
            ? '<option value="OK">OK</option><option value="Limpo">Limpo</option><option value="Manutenção">Manutenção</option>'
            : '<option value="OK">OK</option><option value="Danificado">Danificado</option><option value="Manutenção">Manutenção</option>';

        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td style="font-weight: 600; color: var(--text-muted);">${num}</td>
            <td><strong>${item}</strong></td>
            <td><input type="text" value="1" style="width: 55px; text-align: center; padding: 8px;" /></td>
            <td>
                <select style="width: 100%; padding: 8px;">
                    ${situacaoOpcoes}
                </select>
            </td>
            <td>
                <select style="width: 100%; padding: 8px;">
                    <option value="Sim">Sim</option>
                    <option value="Não">Não</option>
                </select>
            </td>
            <td><input type="text" placeholder="Detalhes..." style="width: 100%; padding: 8px;" /></td>
        `;
        tbody.appendChild(tr);
    });

    function imprimirRelatorio() {
        window.print();
    }
</script>

</body>
</html>
