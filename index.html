<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Conferência de Ferramental</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --primary-red: #e50914;
            --primary-red-hover: #b20710;
            --border-color: #333333;
            --input-bg: #2a2a2a;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .container {
            max-width: 950px;
            background: var(--card-bg);
            padding: 25px;
            margin: 0 auto;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.2);
            border: 1px solid var(--border-color);
        }

        h2 {
            text-align: center;
            color: var(--primary-red);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h3 {
            text-align: center;
            color: var(--text-color);
            margin-bottom: 20px;
            font-weight: 300;
        }

        .header-fields {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
        }

        .field-group label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9em;
            color: var(--primary-red);
        }

        input[type="text"], input[type="date"], input[type="number"], select, textarea {
            padding: 8px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-color);
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary-red);
        }

        .period-group {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-top: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: var(--primary-red);
            color: white;
            text-transform: uppercase;
            font-size: 0.85em;
        }

        tr:nth-child(even) {
            background-color: #242424;
        }

        .section-title {
            margin-top: 30px;
            background-color: #2a2a2a;
            padding: 10px;
            border-left: 5px solid var(--primary-red);
            color: var(--text-color);
        }

        /* Área de Assinatura Digital */
        .signature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .signature-card {
            background: var(--input-bg);
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .signature-card label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--primary-red);
        }

        canvas {
            background: #ffffff;
            border: 1px solid var(--primary-red);
            border-radius: 4px;
            cursor: crosshair;
            touch-action: none;
            width: 100%;
            height: 120px;
        }

        .sig-btns {
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
        }

        .btn-clear {
            background: #444;
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8em;
        }

        .btn-clear:hover {
            background: var(--primary-red);
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--primary-red);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
            text-transform: uppercase;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background-color: var(--primary-red-hover);
        }

        @media print {
            body { background: white; color: black; }
            .container { box-shadow: none; border: none; background: white; }
            .btn-submit, .btn-clear { display: none; }
            canvas { border: 1px solid #000; }
            h2, .field-group label, th, .signature-card label { color: #000 !important; }
            th { background-color: #ddd !important; color: #000 !important; }
            .section-title { background-color: #eee !important; border-left-color: #000 !important; }
            input, select, textarea { background: white !important; color: black !important; border: 1px solid #ccc !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>RELATÓRIO DE CONFERÊNCIA DE FERRAMENTAL</h2>
    <h3>EQUIPE TÉCNICA REGIONAL AMPÉRE</h3>

    <form id="ferramentalForm">
        <div class="header-fields">
            <div class="field-group">
                <label>Colaborador / Técnico:</label>
                <input type="text" required>
            </div>
            <div class="field-group">
                <label>Data da Conferência:</label>
                <input type="date" required>
            </div>
            <div class="field-group">
                <label>Cidade:</label>
                <input type="text" required>
            </div>
            <div class="field-group">
                <label>Veículo:</label>
                <input type="text" required>
            </div>
            <div class="field-group">
                <label>Responsável pela Conferência:</label>
                <input type="text" required>
            </div>
            <div class="field-group">
                <label>Periodicidade:</label>
                <div class="period-group">
                    <label><input type="radio" name="periodicidade" value="Inicial"> Inicial</label>
                    <label><input type="radio" name="periodicidade" value="Periódica"> Periódica</label>
                    <label><input type="radio" name="periodicidade" value="Final"> Final</label>
                </div>
            </div>
        </div>

        <h3 class="section-title">RELAÇÃO DE FERRAMENTAS E EQUIPAMENTOS</h3>

        <table>
            <thead>
                <tr>
                    <th style="width: 5%;">Nº</th>
                    <th style="width: 30%;">Ferramenta / Equipamento</th>
                    <th style="width: 10%;">Qtd.</th>
                    <th style="width: 20%;">Situação</th>
                    <th style="width: 15%;">Conferido</th>
                    <th style="width: 20%;">Observações</th>
                </tr>
            </thead>
            <tbody>
                <script>
                    const ferramentas = [
                        "Chave de fenda", "Chave Phillips", "Alicate de corte", "Alicate universal", 
                        "Alicate de crimpar", "Chave de boca", "Brocas", "Kit conector de fibra", 
                        "Clivador", "Power Meter", "Laser", "Testador de cabo", 
                        "Broca para concreto", "Broca para madeira", "Parafusadeira", "Furadeira", 
                        "Carrinho de Fibra", "Guia (Passa Fio)", "Modelo do celular", "Modelo do notebook"
                    ];

                    document.write(ferramentas.map((item, index) => `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${item}</td>
                            <td><input type="number" min="0" value="1"></td>
                            <td>
                                <select>
                                    <option value="OK">OK</option>
                                    <option value="Danificado">Danificado</option>
                                    <option value="Manutenção">Manutenção</option>
                                </select>
                            </td>
                            <td>
                                <select>
                                    <option value="Sim">Sim</option>
                                    <option value="Não">Não</option>
                                </select>
                            </td>
                            <td><input type="text"></td>
                        </tr>
                    `).join(''));
                </script>
                <tr>
                    <td>21</td>
                    <td>Estado do Veículo</td>
                    <td><input type="number" min="0" value="1"></td>
                    <td>
                        <select>
                            <option value="OK">OK</option>
                            <option value="Limpo">Limpo</option>
                            <option value="Manutenção">Manutenção</option>
                        </select>
                    </td>
                    <td>
                        <select>
                            <option value="Sim">Sim</option>
                            <option value="Não">Não</option>
                        </select>
                    </td>
                    <td><input type="text"></td>
                </tr>
            </tbody>
        </table>

        <h3 class="section-title">PARECER DA CONFERÊNCIA</h3>
        
        <div style="margin-top: 15px;">
            <label><input type="checkbox" name="parecer" value="ok"> Todo o ferramental conferido e disponível para utilização.</label><br><br>
            <label><input type="checkbox" name="parecer" value="danificado"> Existem itens danificados ou que necessitam manutenção.</label><br><br>
            <label><input type="checkbox" name="parecer" value="faltando"> Existem itens faltantes, devendo ser providenciada reposição.</label>
        </div>

        <div style="margin-top: 15px;">
            <label style="font-weight: bold; color: var(--primary-red);">Descrição das pendências:</label>
            <textarea rows="4" style="margin-top: 5px; width: 100%;"></textarea>
        </div>

        <h3 class="section-title">ASSINATURA DIGITAL</h3>

        <div class="signature-grid">
            <div class="signature-card">
                <label>Assinatura do Técnico 1</label>
                <canvas id="sig1"></canvas>
                <div class="sig-btns">
                    <button type="button" class="btn-clear" onclick="clearCanvas('sig1')">Limpar</button>
                </div>
            </div>
            <div class="signature-card">
                <label>Assinatura do Técnico 2</label>
                <canvas id="sig2"></canvas>
                <div class="sig-btns">
                    <button type="button" class="btn-clear" onclick="clearCanvas('sig2')">Limpar</button>
                </div>
            </div>
            <div class="signature-card">
                <label>Assinatura do Responsável</label>
                <canvas id="sig3"></canvas>
                <div class="sig-btns">
                    <button type="button" class="btn-clear" onclick="clearCanvas('sig3')">Limpar</button>
                </div>
            </div>
        </div>

        <button type="button" class="btn-submit" onclick="window.print()">Salvar / Imprimir PDF</button>
    </form>
</div>

<script>
    // Lógica para desenhar nas assinaturas digitais (Mouse e Touch)
    function setupSignatureCanvas(canvasId) {
        const canvas = document.getElementById(canvasId);
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        // Ajusta a resolução interna do canvas
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;

        ctx.strokeStyle = '#000000'; // Cor da caneta preta para legibilidade ao imprimir
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startDrawing(e) {
            isDrawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            e.preventDefault();
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            e.preventDefault();
        }

        function stopDrawing() {
            isDrawing = false;
        }

        // Mouse Events
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        // Touch Events (Celular / Tablet)
        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);
    }

    function clearCanvas(canvasId) {
        const canvas = document.getElementById(canvasId);
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // Inicializa os 3 blocos de assinatura
    window.onload = function() {
        setupSignatureCanvas('sig1');
        setupSignatureCanvas('sig2');
        setupSignatureCanvas('sig3');
    };
</script>

</body>
</html>
