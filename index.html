<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Conferência de Ferramental</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1a1a1a;
            --primary-color: #e50914;
            --primary-hover: #b20710;
            --text-color: #e0e0e0;
            --text-muted: #999;
            --border-color: #2c2c2c;
            --input-bg: #242424;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 30px 15px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
        }

        .report-header {
            text-align: center;
            margin-bottom: 35px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        h2 {
            margin: 0 0 8px 0;
            color: #fff;
            font-size: 24px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
        }

        .section-title {
            font-size: 15px;
            color: #fff;
            background: linear-gradient(90deg, var(--primary-color), transparent);
            padding: 8px 12px;
            margin: 30px 0 20px 0;
            border-left: 4px solid var(--primary-color);
            border-radius: 0 4px 4px 0;
            font-weight: 600;
        }

        .header-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .form-group input, .form-group select {
            padding: 12px 14px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(229, 9, 20, 0.2);
        }

        .periodicidade-group {
            display: flex;
            gap: 10px;
            background-color: var(--input-bg);
            padding: 6px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            align-items: center;
            justify-content: space-between;
        }

        .periodicidade-group label {
            flex: 1;
            text-align: center;
            margin: 0;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
            color: var(--text-color);
            text-transform: uppercase;
        }

        .periodicidade-group input[type="radio"] {
            display: none;
        }

        .periodicidade-group input[type="radio"]:checked + span {
            background-color: var(--primary-color);
            color: #fff;
            font-weight: bold;
            display: block;
            border-radius: 4px;
            padding: 8px;
            margin: -8px;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: var(--primary-color);
            color: white;
            padding: 14px 12px;
            font-size: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
            vertical-align: middle;
        }

        tbody tr {
            background-color: #161616;
            transition: background 0.2s;
        }

        tbody tr:nth-child(even) {
            background-color: #1a1a1a;
        }

        tbody tr:hover {
            background-color: #222;
        }

        td input.qty-input {
            width: 55px;
            text-align: center;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px;
            border-radius: 4px;
        }

        td select {
            padding: 8px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 4px;
            width: 100%;
            cursor: pointer;
        }

        td input.obs-input {
            width: 100%;
            box-sizing: border-box;
            padding: 8px 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 4px;
            font-size: 13px;
        }

        td input.obs-input:focus, td input.qty-input:focus, td select:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .parecer {
            background-color: var(--input-bg);
            padding: 25px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .parecer-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .parecer-options label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 13px;
            background: #191919;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            transition: border-color 0.2s;
        }

        .parecer-options label:hover {
            border-color: var(--primary-color);
        }

        .parecer-options input[type="checkbox"] {
            accent-color: var(--primary-color);
            width: 16px;
            height: 16px;
        }

        .signatures {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }

        .sig-box {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .sig-line {
            border-top: 1px dashed #555;
            margin-top: 35px;
            margin-bottom: 8px;
            padding-top: 8px;
            font-weight: 600;
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .btn-container {
            text-align: center;
        }

        button.btn-action {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.3s, transform 0.1s;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(229, 9, 20, 0.4);
        }

        button.btn-action:hover {
            background-color: var(--primary-hover);
        }

        button.btn-action:active {
            transform: scale(0.98);
        }

        @media print {
            body {
                background-color: #fff;
                color: #000;
                padding: 0;
            }
            .container {
                box-shadow: none;
                border: none;
                padding: 10px;
                background: #fff;
            }
            input, select {
                background: transparent !important;
                color: #000 !important;
                border: 1px solid #ccc !important;
            }
            th {
                background-color: #333 !important;
                color: #fff !important;
            }
            .btn-container {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="report-header">
            <h2>RELATÓRIO DE CONFERÊNCIA DE FERRAMENTAL</h2>
            <p class="subtitle">Equipe Técnica Regional Ampére</p>
        </div>

        <div class="header-grid">
            <div class="form-group">
                <label>Colaborador / Técnico</label>
                <input type="text" id="colaborador" placeholder="Nome do colaborador...">
            </div>
            <div class="form-group">
                <label>Data da Conferência</label>
                <input type="date" id="data">
            </div>
            <div class="form-group">
                <label>Cidade</label>
                <input type="text" id="cidade" placeholder="Cidade...">
            </div>
            <div class="form-group">
                <label>Veículo</label>
                <input type="text" id="veiculo" placeholder="Modelo / Placa...">
            </div>
            <div class="form-group">
                <label>Responsável pela Conferência</label>
                <input type="text" id="responsavel" placeholder="Nome do responsável...">
            </div>
            <div class="form-group">
                <label>Periodicidade</label>
                <div class="periodicidade-group">
                    <label><input type="radio" name="periodicidade" value="INICIAL"><span>Inicial</span></label>
                    <label><input type="radio" name="periodicidade" value="PERIÓDICA"><span>Periódica</span></label>
                    <label><input type="radio" name="periodicidade" value="FINAL"><span>Final</span></label>
                </div>
            </div>
        </div>

        <div class="section-title">RELAÇÃO DE FERRAMENTAS E EQUIPAMENTOS</div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 6%;">Nº</th>
                        <th style="width: 29%;">Ferramenta / Equipamento</th>
                        <th style="width: 10%;">Qtd.</th>
                        <th style="width: 18%;">Situação</th>
                        <th style="width: 15%;">Conferido</th>
                        <th style="width: 22%;">Observações</th>
                    </tr>
                </thead>
                <tbody id="tabela-ferramentas">
                    <script>
                        const ferramentas = [
                            "Alicate de crimpar",
                            "Alicate de corte",
                            "Alicate universal",
                            "Bits para parafusadeira",
                            "Broca para concreto",
                            "Broca para madeira",
                            "Caneta teste de indução",
                            "Carrinho de Fibra",
                            "Chave cachimbo",
                            "Chave de boca",
                            "Chave de fenda",
                            "Chave Phillips",
                            "Clivador",
                            "Cone de sinalização",
                            "Estilete",
                            "Facão",
                            "Furadeira",
                            "Guia (Passa Fio)",
                            "Kit conector de fibra",
                            "Laser",
                            "Limpador de ONU",
                            "Martelo",
                            "Modelo do celular",
                            "Modelo do notebook",
                            "Nivelador de escada",
                            "Parafusadeira",
                            "Power Meter",
                            "Testador de cabo",
                            "Vara de Manobra",
                            "Vara de pescar Fio",
                            "Estado do Veículo"
                        ];

                        ferramentas.forEach((item, index) => {
                            let situacaoOptions = item === "Estado do Veículo" 
                                ? `<option>OK</option><option>Limpo</option><option>Manutenção</option>` 
                                : `<option>OK</option><option>Danificado</option><option>Manutenção</option>`;

                            document.write(`
                                <tr>
                                    <td>${index + 1}</td>
                                    <td style="font-weight: 500;">${item}</td>
                                    <td><input type="text" class="qty-input" value="1"></td>
                                    <td><select>${situacaoOptions}</select></td>
                                    <td>
                                        <select>
                                            <option>Sim</option>
                                            <option>Não</option>
                                        </select>
                                    </td>
                                    <td><input type="text" class="obs-input" placeholder="Detalhes..."></td>
                                </tr>
                            `);
                        });
                    </script>
                </tbody>
            </table>
        </div>

        <div class="parecer">
            <div class="section-title" style="margin-top: 0; background: none; border-left: none; padding-left: 0;">PARECER DA CONFERÊNCIA</div>
            <div class="parecer-options">
                <label><input type="checkbox"> Todo o ferramental conferido e disponível para utilização.</label>
                <label><input type="checkbox"> Existem itens danificados ou que necessitam manutenção.</label>
                <label><input type="checkbox"> Existem itens faltantes, devendo ser providenciada reposição.</label>
            </div>
            <div class="form-group" style="margin-top: 15px;">
                <label>Descrição das Pendências / Observações Gerais</label>
                <input type="text" class="obs-input" style="padding: 12px;" placeholder="Descreva eventuais pendências encontradas...">
            </div>
        </div>

        <div class="signatures">
            <div class="sig-box">
                <div class="sig-line">TÉCNICO 1</div>
            </div>
            <div class="sig-box">
                <div class="sig-line">TÉCNICO 2</div>
            </div>
            <div class="sig-box">
                <div class="sig-line">RESPONSÁVEL</div>
            </div>
        </div>

        <div class="btn-container">
            <button class="btn-action" onclick="window.print()">SALVAR / IMPRIMIR RELATÓRIO</button>
        </div>
    </div>
</body>
</html>
